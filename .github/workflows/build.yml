name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The apt step has timed out often (2026-10-22 to 24). Its package lists and .deb files are cached: on a cache hit
      # the install runs offline from them, and only falls back to the network if that fails.
      - name: Restore apt cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-v1-ubuntu-24.04-${{ hashFiles('.github/workflows/build.yml') }}
          # Any change to this file changes the key; then the newest cache still serves the offline install below.
          restore-keys: apt-v1-ubuntu-24.04-
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          PACKAGES="bison flex g++ gcc-arm-none-eabi make ninja-build pkg-config wget python3 xz-utils nasm libc6:i386 libpng-dev libgl1 libglib2.0-0t64 libx11-6"
          sudo dpkg --add-architecture i386
          if [ -d ~/apt-cache/lists ] && [ -d ~/apt-cache/archives ]; then
            sudo cp -a ~/apt-cache/lists/. /var/lib/apt/lists/
            sudo cp -a ~/apt-cache/archives/. /var/cache/apt/archives/
            if sudo apt-get install -y -qq --no-download $PACKAGES; then
              echo "Installed from the apt cache"
              exit 0
            fi
            echo "Offline install from the cache failed; downloading instead"
          fi
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            sudo apt-get $APT_OPTS update -qq && break
            echo "apt-get update failed (attempt $attempt), retrying"
            sleep 10
          done
          sudo apt-get $APT_OPTS install -y -qq $PACKAGES
          # Keep what was downloaded for the next run.
          mkdir -p ~/apt-cache/lists ~/apt-cache/archives
          sudo cp -a /var/lib/apt/lists/. ~/apt-cache/lists/
          sudo cp -a /var/cache/apt/archives/*.deb ~/apt-cache/archives/ 2>/dev/null || true
          sudo rm -f ~/apt-cache/lists/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Save apt cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: apt-v1-ubuntu-24.04-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Cache subprojects and toolchain
        uses: actions/cache@v4
        with:
          path: |
            decomp/subprojects/packagecache
            decomp/tools/metroskrew
          key: deps-${{ hashFiles('decomp/subprojects/*.wrap', 'decomp/Makefile') }}
      - name: Build
        # Sovereign changes the ROM, so build without the retail checksum check.
        run: make -C decomp rom -j"$(nproc)"
      - name: Battle scripts fit their buffer
        run: python3 tools/test/check_battle_scripts.py decomp
      - name: Field-script text IDs fit their one-byte arguments
        run: python3 tools/test/check_byte_text_ids.py decomp
      - name: Field messages fit their two-line boxes
        run: python3 tools/test/check_message_box_lines.py decomp
      - name: Map events name scripts that exist
        run: python3 tools/test/check_event_scripts.py decomp
      - name: Warps and map texts link up
        run: python3 tools/test/check_map_links.py decomp
      - name: Script menus fit on the screen
        run: python3 tools/test/check_menus.py decomp
      - name: Boot smoke test (headless DeSmuME)
        timeout-minutes: 5
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pip install --break-system-packages -q py-desmume pillow
          python3 -W ignore tools/test/boot_smoke.py decomp/build/pokeplatinum.us.nds build/smoke
      - name: Upload boot screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots
          path: build/smoke/*.png
      # The ROM itself is never uploaded: it contains Nintendo's copyrighted code and assets.

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow openpyxl
      - name: Fetch PokeAPI data (pinned; see tools/POKEAPI_COMMIT)
        run: |
          git init -q /tmp/pokeapi
          git -C /tmp/pokeapi remote add origin https://github.com/PokeAPI/pokeapi
          git -C /tmp/pokeapi sparse-checkout set data/v2/csv
          git -C /tmp/pokeapi fetch -q --depth 1 --filter=blob:none origin "$(cat tools/POKEAPI_COMMIT)"
          git -C /tmp/pokeapi checkout -q FETCH_HEAD
      - name: Type chart matches the official chart
        run: python3 tools/test/check_type_chart.py /tmp/pokeapi/data/v2/csv decomp
      - name: Added objects are reachable and block nothing
        # The check finds Sovereign's objects by comparing with vanilla's events, so it needs the decomp's import
        # commit (VANILLA_REF), which the shallow checkout doesn't have.
        run: |
          git fetch -q --no-tags --depth=1 origin 22fddfd4c8d3ce161f1e1a47f1c81634b396f240
          python3 tools/test/check_object_tiles.py decomp
      - name: No script path closes a message twice
        run: python3 tools/test/check_double_close.py decomp
      - name: Battle sprites can be unscrambled (their first four pixels are clear)
        run: python3 tools/test/check_battle_sprites.py decomp
      - name: Engine data regenerates unchanged (moves, abilities, items, species, forms, wild encounters)
        # In this order: each step reads what the ones before it write. gen_species_gen9 compares with vanilla's species
        # files (VANILLA_REF, fetched above). gen_new_species isn't run: it also rewrites the #494-1025 sprites.
        run: |
          python3 tools/engine/gen_moves.py /tmp/pokeapi/data/v2/csv
          python3 tools/engine/gen9_move_fixes.py
          python3 tools/engine/apply_champions_moves.py
          python3 tools/engine/gen_stat_moves.py
          python3 tools/engine/gen_abilities.py /tmp/pokeapi/data/v2/csv
          python3 tools/engine/gen_items.py /tmp/pokeapi/data/v2/csv
          python3 tools/engine/platinum_item_updates.py
          python3 tools/engine/gen_species_gen9.py /tmp/pokeapi/data/v2/csv
          python3 tools/engine/gen_forms.py /tmp/pokeapi/data/v2/csv
          python3 tools/engine/gen_easy_chat_species.py
          python3 tools/engine/place_mega_stones.py
          python3 tools/engine/gen_wild_encounters.py
          git diff --stat --exit-code
      - name: Regenerate and validate docs
        run: tools/regenerate_docs.sh /tmp/pokeapi/data/v2/csv decomp
      - name: Generated files are up to date
        # Anywhere in the repo: several of the generators write into decomp/. The sprite checklist workbook differs on
        # every run (it stores its save time).
        run: git diff --stat --exit-code -- . ':!docs/SpriteChecklist.xlsx'
