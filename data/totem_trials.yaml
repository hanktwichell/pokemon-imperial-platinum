# Sovereign Platinum — Totem trials (owner, 2026-10-22: decision 18).
#
# The 11 Totem Pokémon (12 Totem forms; Mimikyu has Disguised and Busted) are one-time trials scattered along the
# main story, all before the Elite Four. Never wild. Team Galactic's encounters wait on the trials before them, and
# each trial leaves a crown piece (decision 23, docs/Story.md). Each Totem is fought once, with its stat-raising
# Totem aura, and can be caught afterwards in its Totem form.
#
# STATUS: locations and levels approved by the owner (2026-10-22). Helpers per trial still to be filled in.
#
# level: just below the level cap of the next required fight (data/level_caps.yaml), so a trial is tough but legal.
# after: the last required fight before the trial opens. before: the fight whose cap the level sits under.
# aura: the stat boost the Totem gets at the start of the battle, as in its original trial (Sun/Moon or Ultra Sun/Ultra Moon).
#       Checked 2026-10-23 against Serebii's trial pages (serebii.net/sunmoon/islandtrials.shtml and
#       serebii.net/ultrasunultramoon/islandtrials.shtml): every aura's stats now match them. Where Serebii gives no stage
#       count, the stages come from a second guide (samurai-gamers.com's Totem list) and are marked "stages: check".
# allies: the Pokémon it called in its original trial (Sun/Moon and Ultra Sun/Ultra Moon where they differ).
# boost: the aura for the game (tools/engine/gen_totem_trials.py): a stat (atk, def, spe, spa, spd, or all) and its stages.
# helpers: PROPOSAL (Claude B, 2026-10-23): the first is on the field from the start, the other two are the reserves the
#          Totem calls in. Taken from the allies, with a stage the trial's level allows. They're 2 levels below the Totem. The helpers here will be chosen from these.
# why: why this place (a species' Sovereign wild location from data/encounters_sovereign.json, or a theme).
# map: where the Totem stands, once it's on the map (its object in res/field/events, CB-0028).

