# Ally calling (owner, 2026-10-22: approved and locked in):
#   - The trial is a double battle from the start: "Totem X called its ally!" The Totem (with its aura) and one helper
#     face the player's first two Pokémon. A player with one Pokémon fights 1 vs 2.
#   - When the helper faints, the Totem calls the next one into the empty slot, the way a trainer sends out a reserve.
#     Up to 2 reserve helpers (3 in all); after that the Totem fights alone.
#   - Poké Balls can be thrown only while the Totem is the last Pokémon left (Sun/Moon rule); it's caught in Totem form.
#     Helpers are catchable too once they're the last one left.
#   - Helpers are the species called in the original trial, a few levels below the Totem.
#   - Engine work: a wild double battle with a reserve party for the wild side (new). Double battles and refilling a
#     slot from a party already exist for trainers.

