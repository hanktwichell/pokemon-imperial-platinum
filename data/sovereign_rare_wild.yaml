# Sovereign rare wild encounters (decision 28, owner 2026-10-23): the Paradox Pokémon and the Ultra Beasts aren't
# static encounters. Each is a rare wild Pokémon on the maps below, once its gate is met.
#
# Rendered by tools/engine/gen_rare_wild.py into decomp/include/data/sovereign_rare_wild.h (read by
# decomp/src/overlay006/wild_encounters.c) and docs/RareWildEncounters.md.
#
# - rate: the percent of a map's wild encounters (of that terrain) that are this Pokémon. Several entries on one map
#   share a single roll, so their rates add up.
# - terrain: land (tall grass and cave floors) or surf.
# - level: one level, or [min, max].
# - hint: what the Legend Archivist says about where it's seen (also the doc's "Where" column).
# Rolls are skipped in Poké Radar patches, with a partner and in the Safari Game. They can be met again after a catch.

gates:
  paldea:
    text: the Paldea Chronicle is open
    chronicle: 5   # VAR_SOVEREIGN_CHRONICLE
  ultra:
    text: Necrozma is caught
    caught: NECROZMA

