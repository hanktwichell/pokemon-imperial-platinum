# Sovereign Platinum — the Regional Forms Park (decision 22): Pal Park's grounds at the end of Route 221, where the
# regional forms (decision 16) live as wild Pokémon. Generated into decomp/include/data/regional_forms_park.h by
# tools/engine/gen_regional_forms_park.py.
#
# PROPOSAL (2026-10-22, Claude B): which zone holds which forms, the weights and the levels are the owner's call
# (docs/ProjectStatus.md, "Open"). This first version puts each region's forms in its own zone, keeps the evolved
# forms rarer than their pre-evolutions, and gives the Galarian birds low odds, as decision 22 asks.
#
# zones: one per quadrant of the Pal Park map (src/catching_show.c GetEncounterArea), in quadrant order: north-west,
#   north-east, south-west, south-east. Decision 22 makes Pal Park's field, forest, mountain and sea the Alola, Galar,
#   Hisui and Paldea zones. The forest and field have no water and the sea has no tall grass, so their forms all live
#   in the terrain they have (Galar's water forms in the forest's grass, Paldea's forms at sea).
# Each entry: [form (data/forms.csv identifier), weight, min level, max level]. An encounter picks one entry by weight.
# Levels: post-game, around the level cap after the Champion (data/level_caps.yaml).

