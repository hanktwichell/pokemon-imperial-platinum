# Sovereign Platinum — items added after Platinum's last item (ITEM_SECRET_KEY, #467). Milestone E7.
#
# DRAFT (2026-10-22): the list is settled from the owner's decisions; the engine work hasn't started yet.
# Names are PokeAPI's English names. A generator (to be written: tools/engine/gen_items.py) will take price,
# descriptions and fling data from PokeAPI's item CSVs (pinned commit: tools/POKEAPI_COMMIT), and the Mega Stones from
# data/megas.csv (several Legends Z-A stones aren't in PokeAPI yet, so they get Sovereign descriptions).
#
# Owner decisions behind this list (docs/ProjectStatus.md): every held item (E7 request); every form in the game
# (decision 16), so every form-changing item is here; the Rusted Sword/Shield and Ogerpon's masks (decision 15);
# new held items sold at the Veilstone Department Store; Mints and Ability Capsule (QoL, waiting on E7).

