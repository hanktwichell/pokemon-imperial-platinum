# Sovereign Platinum — boss trainer teams (source of truth).
#
# Rendered to docs/TrainerPokemon_Sovereign.md and validated by
#   python3 tools/design/gen_trainer_docs.py --pokeapi /path/to/pokeapi/data/v2/csv
#
# Only trainers that differ from Renegade Platinum v1.3.0 are listed. Every other trainer keeps
# its Renegade team exactly (see RenegadePlatinumV130/Documentation/TrainerPokemon.txt).
#
# Conventions
#   mega:    the Mega form this Pokémon becomes (it must hold the matching stone).
#   ability: the ability before Mega Evolving. The Mega's ability comes from data/megas.csv.
#   evs:     HP/Atk/Def/SpA/SpD/Spe. Vanilla Gen IV trainer data cannot store EVs or exact
#            natures; see docs/TechnicalDesign.md ("Trainer data") for the engine change.
#   ivs:     31 in every stat unless stated (Renegade's important trainers use max difficulty).
#   format:  singles | doubles | multi (2v2 with an ally, e.g. Spear Pillar).
#   Renegade's "(!)" abilities (abilities a species does not normally have) are kept as-is.

