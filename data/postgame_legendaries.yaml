  # ---------------------------------------------------------------- Alola Chronicle
  - chapter: Alola Chronicle
    name: The Island Guardians
    species: [Tapu Koko, Tapu Lele, Tapu Bulu, Tapu Fini]
    level: 65
    location: "Koko — Route 222 beach. Lele — Fullmoon Island grove. Bulu — Floaroma Meadow. Fini — Route 226, an islet at sea"
    steps: Four new shrine objects; interacting starts the battle.
    built: >-
      The Island Guardians (CB-0042), all level 65, from the moment the Alola Chronicle opens (VAR_SOVEREIGN_CHRONICLE
