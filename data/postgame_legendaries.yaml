      Valley Windworks' windmill island (236, 650) at night (8 pm to 4 am) while the player carries the Dark Stone.
      Kyurem sleeps in Mt. Coronet's ice chamber (7, 5), the room off the north room by Route 216, once both are
      caught. The Archivist then gives the DNA Splicers. The furnaces are the Ironworks' own, in place of a new room.
