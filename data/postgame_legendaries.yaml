  - chapter: Unova Chronicle
    name: Truth and Ideals (chapter key)
    species: [Reshiram, Zekrom, Kyurem]
    level: 70
    location: "Reshiram — Fuego Ironworks (by the furnaces). Zekrom — Valley Windworks at night. Kyurem — Mt. Coronet's ice chamber"
    steps: The Archivist gives the Light Stone and Dark Stone. Using each at its location summons Reshiram/Zekrom. Kyurem appears once both are caught. The DNA Splicers and Kyurem's fused forms are in the game (all forms are in scope, owner 2026-10-22).
    built: >-
      Truth and Ideals (CB-0038). The Archivist gives the Light and Dark Stones on the first talk that reaches this
