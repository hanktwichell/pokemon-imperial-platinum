    built: >-
      Zeraora (CB-0043), level 50: a roamer (vanilla's unused Darkrai slot, ROAMING_SLOT_ZERAORA), released the first
      time the Archivist reads the other Alola legends (FLAG_SOVEREIGN_RELEASED_ZERAORA). Knocked out, it's released
