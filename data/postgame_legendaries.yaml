# Sovereign Platinum — how every ADDED Legendary / Mythical / Ultra Beast / Paradox Pokémon is obtained.
# Rendered to docs/PostgameLegendaries.md by tools/design/gen_legendary_doc.py, which checks that all
# 90 added non-regular species are covered exactly once.
#
# Everything here requires FLAG_GAME_CLEAR (Champion). Quests are started by the new
# "Legend Archivist" NPC in the Canalave Library (2F), who reads from a new tome per region once the
# previous chapter is done — the player can also do encounters in any order once a chapter is open.
# Static encounters can be re-fought after a loss/run (Renegade behaviour); all have normal shiny odds.
# Levels follow Renegade's scale: box legendaries 70, other legendaries 60-68, Mythicals 50-60.

hub:
  npc: Legend Archivist (new), Canalave Library 2F
  unlock: Become Champion
  chapters: [Unova Chronicle, Kalos Chronicle, Alola Chronicle, Galar Chronicle, Paldea Chronicle]
  note: Chapters open one after another (each needs the previous chapter's "key" legendary caught), so the post-game has a guided order.
  built: >-
    The Archivist (CB-0035) stands in Canalave Library 2F from the first Hall of Fame; his first talk opens the Unova
    Chronicle (VAR_SOVEREIGN_CHRONICLE). Later talks offer a menu of its legends (CB-0040): Swords of Justice (the
    swords, then Keldeo, CB-0036), Truth and Ideals (the Light and Dark Stones, the dragons, then the DNA Splicers,
    CB-0038), Forces of Nature (the roamers' release, then the Reveal Glass, Landorus and Enamorus, CB-0039) and Other
    legends (Meloetta, Genesect and Victini, CB-0037 and CB-0041). Once Kyurem is caught he opens the Kalos Chronicle
    (CB-0041) and first asks which Chronicle to read from; Kalos has Life and Destruction (Xerneas and Yveltal, then
    Zygarde) and Other legends (the Prison Bottle, Diancie, Hoopa and Volcanion). Xerneas and Yveltal caught open the
    Alola Chronicle (CB-0042): Island Guardians (the Tapus), Sun and Moon (Cosmog, then Necrozma) and Ultra Beasts
    (CB-0043). Every legendary is battled and caught, never given (owner, 2026-10-23). Static encounters share
    CommonScript_SovereignLegendaryEncounter: each stays on the map until the Pokédex has it as caught, and vanishes
    after it's knocked out until the next visit. The player can run, as from any wild battle in Platinum; a run ends
    like a knock-out.

quests:
  # ---------------------------------------------------------------- Unova Chronicle
  - chapter: Unova Chronicle
    name: The Victory Star
    species: [Victini]
    level: 55
    location: Sunyshore City — Vista Lighthouse (top floor)
    steps: Read the Unova Chronicle with the Archivist. A sealed hatch appears in the lighthouse; Volkner opens it.
    built: >-
      Victini (CB-0041): on the west side of the lighthouse's top floor (2, 7), the Totem Togedemaru's floor, from the
      moment the Unova Chronicle opens until it's caught. **Changed from the plan** (owner, 2026-10-23: existing spots
      rather than new rooms): the lighthouse has no basement, so there's no hatch and Volkner doesn't take part; the
      Archivist's Other legends topic points to the top floor.
  - chapter: Unova Chronicle
    name: Swords of Justice
    species: [Cobalion, Terrakion, Virizion]
    level: 65
    location: "Cobalion — Iron Island B2F (side cave); Terrakion — Route 227 (rock pocket); Virizion — Eterna Forest (north corridor)"
    steps: All three are static encounters as soon as the chapter opens.
    built: >-
      Virizion (CB-0035): in the side pocket at the top of Eterna Forest's north corridor (81, 12), past the Cut
      trees (CB-0046 moved it off (80, 10), the only tile facing the hidden Insect Plate). Terrakion (CB-0036): in the rock pocket at the north end of Route 227 (759, 258). Cobalion (CB-0036): in the top pocket of
      Iron Island B2F's right room (17, 1), the side cave reached from B1F; an existing dead end in place of a new one.
  - chapter: Unova Chronicle
    name: The Young Sword
    species: [Keldeo]
    level: 55
    location: Lake Valor (north-west clearing)
    steps: Visit with Cobalion, Terrakion and Virizion in the party.
    built: >-
      Keldeo (CB-0036): in the clearing at Lake Valor's north-west shore (36, 14), there while Cobalion, Terrakion and
      Virizion are all in the party, until it's caught. It comes in its Ordinary Form; the Resolute Form comes with the
      battle forms (FM).
  - chapter: Unova Chronicle
    name: Forces of Nature
    species: [Tornadus, Thundurus, Landorus, Enamorus]
    level: 65
    location: "Tornadus and Thundurus roam Sinnoh (like Mesprit/Cresselia). Landorus — Route 228's ruins. Enamorus — Route 224, Flower Paradise gate"
    steps: Roamers are released when the chapter opens. Bring both to the Route 228 shrine for Landorus; Enamorus appears after Landorus is caught.
    built: >-
      Forces of Nature (CB-0039). The Archivist releases Tornadus and Thundurus as roamers (two new roaming slots,
      FLAG_SOVEREIGN_RELEASED_FORCES_OF_NATURE). One that's knocked out comes back after the next Hall of Fame, when the
      Archivist releases it again. With both caught, he gives the Reveal Glass. Landorus appears in Route 228's ruins
      (the Rock Peak Ruins chamber, (7, 5)) while both are in the party; that chamber stands in for a new shrine.
      Enamorus then waits by the Route 224 tablet (914, 494). All four are level 65.
  - chapter: Unova Chronicle
    name: Truth and Ideals (chapter key)
    species: [Reshiram, Zekrom, Kyurem]
    level: 70
    location: "Reshiram — Fuego Ironworks (by the furnaces). Zekrom — Valley Windworks at night. Kyurem — Mt. Coronet's ice chamber"
    steps: The Archivist gives the Light Stone and Dark Stone. Using each at its location summons Reshiram/Zekrom. Kyurem appears once both are caught. The DNA Splicers and Kyurem's fused forms are in the game (all forms are in scope, owner 2026-10-22).
    built: >-
      Truth and Ideals (CB-0038). The Archivist gives the Light and Dark Stones on the first talk that reaches this
      part. Reshiram stands in Fuego Ironworks (49, 5) while the player carries the Light Stone. Zekrom stands on
      Valley Windworks' windmill island (236, 650) at night (8 pm to 4 am) while the player carries the Dark Stone.
      Kyurem sleeps in Mt. Coronet's ice chamber (7, 5), the room off the north room by Route 216, once both are
      caught. The Archivist then gives the DNA Splicers. The furnaces are the Ironworks' own, in place of a new room.
      All three are level 70.
  - chapter: Unova Chronicle
    name: The Relic Song
    species: [Meloetta]
    level: 55
    location: Hearthome City — Contest Hall stage
    steps: Talk to the composer in the Contest Hall with a Pokémon that knows Sing in the party.
    built: >-
      Meloetta (CB-0037): the composer (a new NPC in the Contest Hall lobby, (8, 7)) lets a party Pokémon that knows
      Sing sing the Relic Song (FLAG_SOVEREIGN_MELOETTA_SONG). Meloetta then stands just in front of the Contest Hall's
      stage (27, 8) until it's caught (CB-0043 moved it off the stage itself, (28, 5), which the player can't walk
      onto; CB-0046 moved it from (29, 8), inside the Beauty's wander area). The stage replaces Amity Square, which has no stage the player can reach and only lets in players leading
      certain Pokémon. It comes in its Aria Forme; the Pirouette Forme comes with the battle forms (FM).

  - chapter: Unova Chronicle
    name: Plasma's Leftovers
    species: [Genesect]
    level: 60
    location: Veilstone City — Team Galactic HQ lab
    steps: A Galactic scientist confesses to reviving a fossil and asks you to stop it. Battle then catch.
    built: >-
      Genesect (CB-0037): the lab's male scientist confesses once the Unova Chronicle is open
      (FLAG_SOVEREIGN_GENESECT_FREED). Genesect then stands in the lab's back room (34, 5), by the Control Room door,
      until it's caught. Its Drive forms come with the forms milestone (FM).

