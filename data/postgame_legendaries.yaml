    location: "Cobalion — Iron Island B2F (side cave); Terrakion — Route 227 (rock pocket); Virizion — Eterna Forest (north corridor)"
    steps: All three are static encounters as soon as the chapter opens.
    built: >-
      Virizion (CB-0035): at the top of Eterna Forest's north corridor (80, 10), past the Cut trees. Terrakion
      (CB-0036): in the rock pocket at the north end of Route 227 (759, 258). Cobalion (CB-0036): in the top pocket of
      Iron Island B2F's right room (17, 1), the side cave reached from B1F; an existing dead end in place of a new one.
