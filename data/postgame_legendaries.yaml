    built: >-
      Victini (CB-0041): on the west side of the lighthouse's top floor (2, 7), the Totem Togedemaru's floor, from the
      moment the Unova Chronicle opens until it's caught. **Changed from the plan** (owner, 2026-10-23: existing spots
      rather than new rooms): the lighthouse has no basement, so there's no hatch and Volkner doesn't take part; the
      Archivist's Other legends topic points to the top floor.
