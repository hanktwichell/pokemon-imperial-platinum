    species: [Nihilego, Buzzwole, Pheromosa, Xurkitree, Celesteela, Kartana, Guzzlord, Stakataka, Blacephalon]
    level: 65
    location: "Nihilego — Iron Island B3F. Buzzwole — Route 225. Pheromosa — Route 229. Xurkitree — Route 222. Celesteela — Mt. Coronet (outside north). Kartana — Eterna Forest. Guzzlord — Turnback Cave. Stakataka — Route 227. Blacephalon — Stark Mountain (outside)"
    steps: After Necrozma is caught, each Ultra Beast is a rare wild encounter (2%) on its map.
    built: >-
      The Ultra Beasts (CB-0043), all level 65, are rare wild encounters once Necrozma is caught
      (data/sovereign_rare_wild.yaml, docs/RareWildEncounters.md): 2% of the wild encounters on Iron Island B3F
