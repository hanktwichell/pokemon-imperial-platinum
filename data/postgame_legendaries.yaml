  - chapter: Kalos Chronicle
    name: Unbound Mischief
    species: [Hoopa]
    level: 55
    location: Solaceon Ruins — innermost chamber
    steps: The Archivist gives a Prison Bottle key item; use it in the ruins.
    built: >-
      Hoopa (CB-0041), level 55: the Archivist's Kalos Other legends topic gives the Prison Bottle. Hoopa then plays
      in the ruins' innermost room, Room 7 (5, 4), while the player carries the bottle, until it's caught. Carrying
