      strip at Route 222's east end (808, 795); Lele at the north-west edge of Fullmoon Island's grove (13, 12); Bulu in
      Floaroma Meadow's north field (24, 36); Fini on the little beach under Route 226's cliffs, reached by Surf
      (716, 345). **Changed from the plan** (owner, 2026-10-23: existing spots): each Tapu stands there itself, with
      no shrine object.
  - chapter: Alola Chronicle
    name: Nebby (chapter key)
    species: [Cosmog, Cosmoem, Solgaleo, Lunala]
    level: 5
    location: Mt. Coronet — the top snowfield
    steps: A Cosmog waits on Mt. Coronet's top snowfield (Lv. 5) to be battled and caught. It evolves into Cosmoem at Lv. 43; Cosmoem becomes Solgaleo with a Sun Stone or Lunala with a Moon Stone (see EvolutionChanges_Sovereign.md). Return there for a second Cosmog after the first evolves, so both Solgaleo and Lunala are obtainable.
    built: >-
      Cosmog (CB-0042, a battle since CB-0043): floating in Mt. Coronet's top snowfield (Mt. Coronet outside north, (35,
      21), the highest walkable spot) once the Alola Chronicle is open, at level 5, until it's caught
      (FLAG_SOVEREIGN_CAUGHT_COSMOG). Once the Pokédex has Solgaleo or Lunala as caught, a second one waits there until
      it's caught too (FLAG_SOVEREIGN_CAUGHT_COSMOG_2). Like every static legendary, one that's knocked out comes back
      on the next visit. **Changed from the plan** (owner, 2026-10-23): legendaries are battled and caught, never given
      (CB-0042 made Cosmog a gift), and Spear Pillar is kept for Dialga, Palkia and the story (decision 27), so Cosmog
      left its plaza.

  - chapter: Alola Chronicle
    name: The Blinding One
    species: [Necrozma]
    level: 70
    location: Wayward Cave 1F — the dark back chamber
    steps: Appears after owning Solgaleo or Lunala.
    built: >-
      Necrozma (CB-0042), level 70: in Wayward Cave 1F's dark north-east chamber, where Mira was lost (70, 9), once the
      Alola Chronicle is open and the Pokédex has Solgaleo or Lunala as caught, until it's caught. Wayward Cave is the
      only cave that needs Flash: a place whose light was stolen. The Archivist then gives the N-Solarizer and
      N-Lunarizer, which fuse it with Solgaleo (Dusk Mane) or Lunala (Dawn Wings) from the bag (FM part 2). **Changed
      from the plan** (owner, 2026-10-23, decision 27): Spear Pillar is kept for Dialga, Palkia and the story.

  - chapter: Alola Chronicle
